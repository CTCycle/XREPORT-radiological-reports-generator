<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XREPORT — Desktop startup error</title>
  <link rel="stylesheet" href="startup.css">
  <style>
    :root { color-scheme: light; font-family: "Space Grotesk", "Segoe UI", sans-serif; background: #e9eef6; color: #20324a; }
    body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: linear-gradient(145deg, #edf2f8, #e9eef6); }
    main { width: min(640px, calc(100% - 48px)); padding: clamp(24px, 6vw, 48px); border: 1px solid #d6dfec; border-radius: 20px; background: #fff; box-shadow: 0 18px 48px #20344a22; }
    .eyebrow { margin: 0 0 12px; color: #2f6de0; font-size: .72rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(1.35rem, 4vw, 2rem); letter-spacing: -.035em; }
    #status { margin: 18px 0 0; white-space: pre-wrap; line-height: 1.6; }
    .log-label { margin: 28px 0 6px; color: #5f728c; font-size: .9rem; }
    #log-path { margin: 0; color: #526277; font-size: .9rem; word-break: break-word; }
  </style>
</head>
<body>
  <main role="alert" aria-live="assertive">
    <p class="eyebrow">XREPORT · Desktop startup</p>
    <h1>XREPORT could not initialize</h1>
    <p id="status">The local backend service did not become ready. Close and relaunch XREPORT to retry.</p>
    <p class="log-label">Technical details were written to:</p>
    <p id="log-path"></p>
  </main>
  <script src="error-page.js"></script>
</body>
</html>
