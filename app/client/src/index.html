<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>XREPORT — Radiological Reports Generator</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta id="theme-color-meta" name="theme-color" content="#e9eef6">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="startup.css">
  <script src="theme-bootstrap.js"></script>
</head>
<body>
  <section id="desktop-startup" class="startup-screen" hidden aria-live="polite" aria-labelledby="desktop-startup-title">
    <div class="startup-shell">
      <header class="startup-brand">
        <p class="startup-kicker">XREPORT</p>
        <h1 id="desktop-startup-title">Radiological Reports Generator</h1>
      </header>
      <div class="startup-layout">
        <div class="startup-visual" aria-hidden="true">
          <div class="startup-xray-frame">
            <img class="startup-xray-image" src="startup-radiograph.png" alt="" aria-hidden="true" />
            <span class="startup-xray-scan" aria-hidden="true"></span>
          </div>
        </div>
        <section class="startup-report" aria-label="Structured report preview">
          <div class="startup-report-heading"><span>REPORT STRUCTURE</span><span class="startup-report-pulse">ANALYZING</span></div>
          <div class="startup-report-section"><h2>FINDINGS</h2><span class="startup-placeholder startup-placeholder--wide"></span><span class="startup-placeholder startup-placeholder--medium"></span><span class="startup-placeholder startup-placeholder--short"></span></div>
          <div class="startup-report-section"><h2>IMPRESSION</h2><span class="startup-placeholder startup-placeholder--wide"></span><span class="startup-placeholder startup-placeholder--medium"></span></div>
        </section>
      </div>
      <div class="startup-status" role="status" aria-live="polite">
        <h2 id="status" class="startup-status-title">Preparing XREPORT</h2>
        <p class="startup-status-copy">Initializing radiology report generation</p>
      </div>
    </div>
  </section>
  <app-root></app-root>
  <script src="desktop-shell.js"></script>
</body>
</html>
