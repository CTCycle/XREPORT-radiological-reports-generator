[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "XREPORT"
version = "3.3.1"
requires-python = ">=3.14"

dependencies = [
    "fastapi==0.128.0",
    "huggingface-hub==0.36.0",
    "requests>=2.32.0",
    "uvicorn[standard]==0.42.0",
    "pydantic==2.12.0",
    "pydantic-settings==2.11.0",
    "keras==3.13.1", 
    "numpy==2.4.1",
    "pandas==3.0.0",
    "SQLAlchemy==2.0.46",
    "alembic==1.19.0",
    "psycopg[binary]==3.3.1",
    "python-dotenv==1.2.1",
    "python-multipart>=0.0.21",  
    "pillow==12.0.0", 
    "transformers==4.57.3",
    "qwen-vl-utils>=0.0.14",
    "pydicom>=3.0.1",
    "psutil>=6.1.1",
]

[project.optional-dependencies]
standard = [
    "accelerate==1.12.0",
    "torch==2.10.0+cpu",
    "torchvision==0.25.0+cpu",
    "timm>=1.0.20",
]
cuda = [
    "accelerate==1.12.0",
    "torch==2.10.0+cu130",
    "torchvision==0.25.0+cu130",
    "timm>=1.0.20",
]
studio = [
    "opencv-python==4.13.0.90",
    "matplotlib==3.10.8",
    "nltk==3.9.2",
    "openpyxl==3.1.5",
]
test = [
    "pytest>=8.0",
    "pytest-playwright>=0.5.0",
    "httpx==0.28.1",
    "ruff==0.15.9",
    "pyright==1.1.408"
]
desktop = [
    "pyinstaller==6.22.2"
]

[tool.hatch.build.targets.wheel]
packages = ["server"] 

[tool.pytest.ini_options]
cache_dir = "../../runtimes/cache/pytest"
norecursedirs = ["cache"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "standard" },
    { index = "pytorch-cu130", extra = "cuda" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "standard" },
    { index = "pytorch-cu130", extra = "cuda" },
]
# torchaudio  = { index = "pytorch-cu130" }

[tool.uv]
conflicts = [[{ extra = "standard" }, { extra = "cuda" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
cache-dir = "../../runtimes/cache/ruff"

[tool.ruff.lint]
extend-select = ["C901", "PLR0912", "PLR0915"]


