# Two independent migration streams. Select one with -n, for example:
#   alembic -c app/server/alembic.ini -n inference upgrade head
#   alembic -c app/server/alembic.ini -n studio revision --autogenerate -m "..."
# The CLI targets the database of the active XREPORT_APP profile unless
# sqlalchemy.url is set, so pair -n studio with XREPORT_APP=studio.

[DEFAULT]
prepend_sys_path = %(here)s/..
path_separator = os
sqlalchemy.url =

[inference]
script_location = %(here)s/migrations/inference

[studio]
script_location = %(here)s/migrations/studio

[post_write_hooks]
# Generated revisions are reviewed manually before they are applied.
