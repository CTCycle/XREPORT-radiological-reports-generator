[package]
name = "xreport-desktop"
version = "3.0.0"
description = "Secure Tauri shell for XREPORT Radiological Reports"
authors = ["CTCycle"]
license = "MIT"
edition = "2021"
rust-version = "1.95.0"
build = "build.rs"

[lib]
name = "xreport_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json = "1"
tauri-build = { version = "=2.6.3", features = [] }
zip = { version = "4", default-features = false, features = ["deflate"] }

[dependencies]
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "=2.11.5", features = [] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging"
] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"
