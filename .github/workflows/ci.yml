name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Backend And Client Validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      XDG_CACHE_HOME: ${{ runner.temp }}/xreport-cache
      RUFF_CACHE_DIR: ${{ runner.temp }}/xreport-ruff
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: xreport
          POSTGRES_USER: xreport
          POSTGRES_PASSWORD: xreport
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U xreport -d xreport"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.30"
          enable-cache: true
          cache-dependency-glob: app/server/uv.lock

      - name: Synchronize locked backend dependencies
        working-directory: app/server
        run: uv sync --locked --extra test --python 3.14.2

      - name: Run Ruff
        working-directory: app/server
        run: .venv/bin/ruff check .

      - name: Run backend unit tests
        run: app/server/.venv/bin/python -m pytest -c app/server/pyproject.toml app/tests/unit -q --basetemp app/tests/cache/pytest-tmp

      - name: Run Pyright
        working-directory: app/server
        run: .venv/bin/pyright .

      - name: Run PostgreSQL persistence contract
        env:
          XREPORT_RUN_POSTGRES_INTEGRATION: "true"
          XREPORT_TEST_DATABASE_HOST: 127.0.0.1
          XREPORT_TEST_DATABASE_PORT: "5432"
          XREPORT_TEST_DATABASE_NAME: xreport
          XREPORT_TEST_DATABASE_USERNAME: xreport
          XREPORT_TEST_DATABASE_PASSWORD: xreport
        run: app/server/.venv/bin/python -m pytest -c app/server/pyproject.toml app/tests/integration -q --basetemp app/tests/cache/pytest-integration-tmp

      - name: Run retained API E2E tests
        run: |
          PYTHONPATH=app app/server/.venv/bin/python -m uvicorn server.app:app --host 127.0.0.1 --port 5003 --log-level warning > /tmp/xreport-api.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5003/api/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5003/api/health > /dev/null || { cat /tmp/xreport-api.log; exit 1; }
          APP_TEST_BACKEND_URL=http://127.0.0.1:5003 app/server/.venv/bin/python -m pytest \
            -c app/server/pyproject.toml \
            app/tests/e2e/test_inference_api.py \
            app/tests/e2e/test_training_api.py \
            app/tests/e2e/test_upload_api.py \
            -q --basetemp app/tests/cache/pytest-e2e-tmp

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: app/client/package-lock.json

      - name: Verify Node toolchain
        shell: bash
        run: |
          test "$(node --version)" = "v22.22.3"
          test "$(npm --version)" = "10.9.8"

      - name: Install client dependencies
        working-directory: app/client
        run: npm ci --no-audit --no-fund

      - name: Build client
        working-directory: app/client
        run: npm run build

      - name: Lint client
        working-directory: app/client
        run: npm run lint

      - name: Run client unit tests
        working-directory: app/client
        run: npm run test:unit

      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: xreport-ci-diagnostics-${{ github.run_id }}
          retention-days: 3
          if-no-files-found: ignore
          path: |
            /tmp/xreport-api.log
            app/tests/cache/
