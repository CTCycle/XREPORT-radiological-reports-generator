name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  validation:
    name: Backend And Client Validation
    runs-on: ubuntu-latest
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/runtimes/cache/uv
      PIP_CACHE_DIR: ${{ github.workspace }}/runtimes/cache/pip
      NPM_CONFIG_CACHE: ${{ github.workspace }}/runtimes/cache/npm
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/runtimes/cache/playwright-browsers
      XDG_CACHE_HOME: ${{ github.workspace }}/app/tests/cache
      RUFF_CACHE_DIR: ${{ github.workspace }}/app/tests/cache/ruff
      MYPY_CACHE_DIR: ${{ github.workspace }}/app/tests/cache/mypy
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/app/tests/cache/python
      COVERAGE_FILE: ${{ github.workspace }}/app/tests/cache/coverage/.coverage
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: xreport
          POSTGRES_USER: xreport
          POSTGRES_PASSWORD: xreport
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U xreport -d xreport"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"

      - name: Install uv
        run: python -m pip install uv==0.11.9

      - name: Synchronize locked backend dependencies
        working-directory: app/server
        run: uv sync --frozen --extra test --python 3.14.2

      - name: Run Ruff
        working-directory: app/server
        run: .venv/bin/ruff check .

      - name: Run backend unit tests
        run: app/server/.venv/bin/python -m pytest app/tests/unit -q --basetemp app/tests/cache/pytest-tmp

      - name: Run Pyright
        working-directory: app/server
        run: .venv/bin/pyright .

      - name: Run PostgreSQL persistence contract
        env:
          XREPORT_RUN_POSTGRES_INTEGRATION: "true"
          XREPORT_TEST_DATABASE_HOST: 127.0.0.1
          XREPORT_TEST_DATABASE_PORT: "5432"
          XREPORT_TEST_DATABASE_NAME: xreport
          XREPORT_TEST_DATABASE_USERNAME: xreport
          XREPORT_TEST_DATABASE_PASSWORD: xreport
        run: app/server/.venv/bin/python -m pytest app/tests/integration -q --basetemp app/tests/cache/pytest-integration-tmp

      - name: Run retained API E2E tests
        run: |
          PYTHONPATH=app app/server/.venv/bin/python -m uvicorn server.app:app --host 127.0.0.1 --port 5003 --log-level warning > /tmp/xreport-api.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5003/api/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5003/api/health > /dev/null || { cat /tmp/xreport-api.log; exit 1; }
          APP_TEST_BACKEND_URL=http://127.0.0.1:5003 app/server/.venv/bin/python -m pytest \
            app/tests/e2e/test_inference_api.py \
            app/tests/e2e/test_training_api.py \
            app/tests/e2e/test_upload_api.py \
            -q --basetemp app/tests/cache/pytest-e2e-tmp

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"

      - name: Verify Node toolchain
        shell: bash
        run: |
          test "$(node --version)" = "v22.22.3"
          test "$(npm --version)" = "10.9.8"

      - name: Install client dependencies
        working-directory: app/client
        run: npm ci --no-audit --no-fund

      - name: Build client
        working-directory: app/client
        run: npm run build

      - name: Lint client
        working-directory: app/client
        run: npm run lint

      - name: Run client unit tests
        working-directory: app/client
        run: npm run test:unit
