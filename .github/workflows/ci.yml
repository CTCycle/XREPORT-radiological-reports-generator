name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  validation:
    name: Backend And Client Validation
    runs-on: ubuntu-latest
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/runtimes/cache/uv
      PIP_CACHE_DIR: ${{ github.workspace }}/runtimes/cache/pip
      NPM_CONFIG_CACHE: ${{ github.workspace }}/runtimes/cache/npm
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/runtimes/cache/playwright-browsers
      XDG_CACHE_HOME: ${{ github.workspace }}/app/tests/cache
      RUFF_CACHE_DIR: ${{ github.workspace }}/app/tests/cache/ruff
      MYPY_CACHE_DIR: ${{ github.workspace }}/app/tests/cache/mypy
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/app/tests/cache/python
      COVERAGE_FILE: ${{ github.workspace }}/app/tests/cache/coverage/.coverage
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: xreport
          POSTGRES_USER: xreport
          POSTGRES_PASSWORD: xreport
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U xreport -d xreport"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Create backend environment
        working-directory: app/server
        run: uv venv .venv --python 3.14

      - name: Install backend dependencies from project metadata
        working-directory: app/server
        run: uv sync --extra test --python .venv/bin/python

      - name: Run Ruff
        working-directory: app/server
        run: .venv/bin/ruff check .

      - name: Run backend unit tests
        run: app/server/.venv/bin/python -m pytest app/tests/unit -q --basetemp app/tests/cache/pytest-tmp

      - name: Run Pyright
        working-directory: app/server
        run: .venv/bin/pyright .

      - name: Run PostgreSQL persistence tests
        env:
          EMBEDDED_DATABASE: false
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 5432
          DATABASE_NAME: xreport
          DATABASE_USERNAME: xreport
          DATABASE_PASSWORD: xreport
        run: app/server/.venv/bin/python -m pytest app/tests/integration -q --basetemp app/tests/cache/pytest-tmp

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install client dependencies
        working-directory: app/client
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Build client
        working-directory: app/client
        run: npm run build

      - name: Lint client
        working-directory: app/client
        run: npm run lint

      - name: Run client unit tests
        working-directory: app/client
        run: npm run test:unit
