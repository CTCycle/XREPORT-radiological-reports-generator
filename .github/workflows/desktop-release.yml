name: XREPORT Windows desktop release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 3.0.0)
        required: true
        type: string

jobs:
  package:
    name: Package ${{ matrix.variant }} desktop
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: Cpu
            artifact: cpu
          - variant: Cuda
            artifact: cuda
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert generated desktop inputs are absent
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath 'app/desktop/src-tauri/ui') { throw 'Generated desktop UI exists in the clean checkout.' }
          if (Test-Path -LiteralPath 'app/desktop/src-tauri/generated/runtime.zip') { throw 'Generated runtime archive exists in the clean checkout.' }

      - name: Resolve and validate version
        shell: pwsh
        run: |
          $version = "$env:RELEASE_VERSION" -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid release version: $version" }
          $metadata = & .\start_on_windows.ps1 -Action BuildDesktopRelease -DesktopRuntime ${{ matrix.variant }} -DesktopTarget All -Version $version -Force 2>&1
          if ($LASTEXITCODE -ne 0) { throw "Desktop packaging failed: $LASTEXITCODE`n$($metadata -join "`n")" }

      - name: Inspect release artifacts and checksums
        shell: pwsh
        run: |
          $version = "$env:RELEASE_VERSION" -replace '^v', ''
          $prefix = "release\XREPORT-v$version-windows-x64-${{ matrix.artifact }}"
          foreach ($name in @("$prefix-portable.exe", "$prefix.msi", "$prefix.sha256")) {
            if (-not (Test-Path -LiteralPath $name)) { throw "Missing artifact: $name" }
          }
          $hashLines = Get-Content -LiteralPath "$prefix.sha256"
          $invalid = @($hashLines | Where-Object { $_ -notmatch '^[0-9a-f]{64}  XREPORT-' })
          if ($hashLines.Count -ne 2 -or $invalid.Count -gt 0) { throw 'Checksum manifest is not standard sha256sum format.' }
          Get-ChildItem release | Select-Object Name,Length | Format-Table

      - name: Verify packaged runtime and MSI resource
        shell: pwsh
        run: |
          & .\app\desktop\build\verify_desktop_artifacts.ps1 -Variant '${{ matrix.artifact }}' -Version ($env:RELEASE_VERSION -replace '^v', '')
          if ($LASTEXITCODE -ne 0) { throw "Artifact verification failed with exit code $LASTEXITCODE." }

      - name: Smoke-test packaged portable application
        shell: pwsh
        run: |
          & .\app\desktop\build\smoke_desktop.ps1 -Variant '${{ matrix.artifact }}' -Version ($env:RELEASE_VERSION -replace '^v', '')
          if ($LASTEXITCODE -ne 0) { throw "Desktop smoke test failed with exit code $LASTEXITCODE." }

      - name: Upload portable, MSI, and manifests
        uses: actions/upload-artifact@v4
        with:
          name: XREPORT-${{ matrix.artifact }}-windows-x64
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION_INPUT: ${{ inputs.version || github.ref_name }}

    steps:
      - name: Resolve release version
        shell: bash
        run: |
          version="${RELEASE_VERSION_INPUT#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"

      - name: Download verified package outputs
        uses: actions/download-artifact@v4
        with:
          pattern: XREPORT-*-windows-x64
          path: release-assets
          merge-multiple: true

      - name: Validate published asset set
        shell: bash
        run: |
          expected=(
            "XREPORT-v${RELEASE_VERSION}-windows-x64-cpu-portable.exe"
            "XREPORT-v${RELEASE_VERSION}-windows-x64-cpu.msi"
            "XREPORT-v${RELEASE_VERSION}-windows-x64-cpu.sha256"
            "XREPORT-v${RELEASE_VERSION}-windows-x64-cpu-build.json"
            "XREPORT-v${RELEASE_VERSION}-windows-x64-cuda-portable.exe"
            "XREPORT-v${RELEASE_VERSION}-windows-x64-cuda.msi"
            "XREPORT-v${RELEASE_VERSION}-windows-x64-cuda.sha256"
            "XREPORT-v${RELEASE_VERSION}-windows-x64-cuda-build.json"
          )
          actual_count=$(find release-assets -mindepth 1 -maxdepth 1 -type f | wc -l)
          if [[ "$actual_count" -ne "${#expected[@]}" ]]; then
            echo "Expected ${#expected[@]} files, found $actual_count" >&2
            find release-assets -maxdepth 2 -print >&2
            exit 1
          fi
          for name in "${expected[@]}"; do
            if [[ ! -s "release-assets/$name" ]]; then
              echo "Missing or empty release asset: $name" >&2
              exit 1
            fi
          done
          if find release-assets -mindepth 1 -maxdepth 1 ! -type f -print -quit | grep -q .; then
            echo 'Release asset directory contains an unexpected subdirectory.' >&2
            exit 1
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "XREPORT $RELEASE_TAG" \
              --generate-notes \
              --verify-tag
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "XREPORT $RELEASE_TAG" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi
