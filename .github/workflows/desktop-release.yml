name: XREPORT Windows desktop release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 3.1.0)
        required: true
        type: string
      source_commit:
        description: Immutable source commit used by the retained package run
        required: false
        type: string
      package_run_id:
        description: Earlier workflow run ID whose verified package artifacts should be approved and published
        required: false
        type: string

jobs:
  package:
    name: Package ${{ matrix.variant }} desktop
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: Cpu
            artifact: cpu
          - variant: Cuda
            artifact: cuda
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
      SOURCE_COMMIT: ${{ inputs.source_commit || github.sha }}
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout immutable build source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          fetch-depth: 1

      - name: Validate workflow phase inputs
        shell: pwsh
        run: |
          if ($env:SOURCE_COMMIT -notmatch '^[0-9a-f]{40}$') { throw "source_commit must be a 40-character commit SHA: $env:SOURCE_COMMIT" }
          if ($env:RELEASE_VERSION -notmatch '^v?\d+\.\d+\.\d+$') { throw "Invalid release version: $env:RELEASE_VERSION" }
          $hasPackageRun = -not [string]::IsNullOrWhiteSpace('${{ inputs.package_run_id }}')
          $hasSourceCommit = -not [string]::IsNullOrWhiteSpace('${{ inputs.source_commit }}')
          if ($hasPackageRun -and -not $hasSourceCommit) {
            throw 'source_commit is required when package_run_id reuses a completed package run.'
          }
          if (-not $hasPackageRun -and $hasSourceCommit) {
            throw 'source_commit may only be supplied when package_run_id reuses a completed package run.'
          }

      - name: Download retained package outputs for approval phase
        if: ${{ inputs.package_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.package_run_id }}
          github-token: ${{ github.token }}
          name: XREPORT-${{ matrix.artifact }}-windows-x64
          path: release

      - name: Assert generated desktop inputs are absent
        if: ${{ inputs.package_run_id == '' }}
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath 'app/desktop/src-tauri/ui') { throw 'Generated desktop UI exists in the clean checkout.' }
          if (Test-Path -LiteralPath 'app/desktop/src-tauri/generated/runtime.zip') { throw 'Generated runtime archive exists in the clean checkout.' }

      - name: Build desktop package for preparation phase
        if: ${{ inputs.package_run_id == '' }}
        shell: pwsh
        run: |
          $version = "$env:RELEASE_VERSION" -replace '^v', ''
          $metadata = & .\start_on_windows.ps1 -Action BuildDesktopRelease -DesktopRuntime ${{ matrix.variant }} -DesktopTarget All -Version $version -Force 2>&1
          if ($LASTEXITCODE -ne 0) { throw "Desktop packaging failed: $LASTEXITCODE`n$($metadata -join "`n")" }

      - name: Inspect release artifacts and checksums
        shell: pwsh
        run: |
          $version = "$env:RELEASE_VERSION" -replace '^v', ''
          $prefix = "release\XREPORT-v$version-windows-x64-${{ matrix.artifact }}"
          foreach ($name in @("$prefix-portable.exe", "$prefix.msi", "$prefix.sha256")) {
            if (-not (Test-Path -LiteralPath $name)) { throw "Missing artifact: $name" }
          }
          $hashLines = Get-Content -LiteralPath "$prefix.sha256"
          $invalid = @($hashLines | Where-Object { $_ -notmatch '^[0-9a-f]{64}  XREPORT-' })
          if ($hashLines.Count -ne 2 -or $invalid.Count -gt 0) { throw 'Checksum manifest is not standard sha256sum format.' }
          $metadata = Get-Content -LiteralPath "$prefix-build.json" -Raw | ConvertFrom-Json
          if ([string]$metadata.source_commit -ne $env:SOURCE_COMMIT) { throw "Package source commit mismatch: $($metadata.source_commit) != $env:SOURCE_COMMIT" }
          if ([string]$metadata.version -ne $version) { throw "Package version mismatch: $($metadata.version) != $version" }
          if ([string]$metadata.variant -ne '${{ matrix.artifact }}') { throw "Package variant mismatch: $($metadata.variant)" }
          Get-ChildItem release | Select-Object Name,Length | Format-Table

      - name: Verify packaged runtime and MSI resource
        shell: pwsh
        run: |
          & .\app\desktop\build\verify_desktop_artifacts.ps1 -Variant '${{ matrix.artifact }}' -Version ($env:RELEASE_VERSION -replace '^v', '')
          if ($LASTEXITCODE -ne 0) { throw "Artifact verification failed with exit code $LASTEXITCODE." }

      - name: Smoke-test packaged portable application
        shell: pwsh
        run: |
          & .\app\desktop\build\smoke_desktop.ps1 -Variant '${{ matrix.artifact }}' -Version ($env:RELEASE_VERSION -replace '^v', '')
          if ($LASTEXITCODE -ne 0) { throw "Desktop smoke test failed with exit code $LASTEXITCODE." }

      - name: Upload portable, MSI, and manifests
        uses: actions/upload-artifact@v4
        with:
          name: XREPORT-${{ matrix.artifact }}-windows-x64
          path: release/*
          if-no-files-found: error
          retention-days: 7

      - name: Publish preparation handoff
        if: ${{ inputs.package_run_id == '' }}
        shell: pwsh
        run: |
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Preparation complete for source commit ``$env:SOURCE_COMMIT``. Retain this workflow run ID and use it as ``package_run_id`` in the approval phase after committing the approved manifest."

  publish:
    name: Publish GitHub Release
    needs: package
    if: github.event_name == 'workflow_dispatch' && inputs.package_run_id != ''
    runs-on: ubuntu-latest
    environment:
      name: release-approval
    permissions:
      contents: write
    env:
      RELEASE_VERSION_INPUT: ${{ inputs.version || github.ref_name }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}

    steps:
      - name: Resolve release version
        shell: bash
        run: |
          version="${RELEASE_VERSION_INPUT#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
          if [[ ! "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The approval phase requires source_commit to identify the immutable package build." >&2
            exit 1
          fi

      - name: Check out exact source for release approval
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Download verified package outputs
        uses: actions/download-artifact@v4
        with:
          pattern: XREPORT-*-windows-x64
          path: release-assets
          merge-multiple: true

      - name: Validate published asset set
        shell: bash
        run: |
          expected=(
            "XREPORT-v${RELEASE_VERSION}-windows-x64-cpu-portable.exe"
            "XREPORT-v${RELEASE_VERSION}-windows-x64-cpu.msi"
            "XREPORT-v${RELEASE_VERSION}-windows-x64-cpu.sha256"
            "XREPORT-v${RELEASE_VERSION}-windows-x64-cpu-build.json"
            "XREPORT-v${RELEASE_VERSION}-windows-x64-cuda-portable.exe"
            "XREPORT-v${RELEASE_VERSION}-windows-x64-cuda.msi"
            "XREPORT-v${RELEASE_VERSION}-windows-x64-cuda.sha256"
            "XREPORT-v${RELEASE_VERSION}-windows-x64-cuda-build.json"
          )
          actual_count=$(find release-assets -mindepth 1 -maxdepth 1 -type f | wc -l)
          if [[ "$actual_count" -ne "${#expected[@]}" ]]; then
            echo "Expected ${#expected[@]} files, found $actual_count" >&2
            find release-assets -maxdepth 2 -print >&2
            exit 1
          fi
          for name in "${expected[@]}"; do
            if [[ ! -s "release-assets/$name" ]]; then
              echo "Missing or empty release asset: $name" >&2
              exit 1
            fi
          done
          if find release-assets -mindepth 1 -maxdepth 1 ! -type f -print -quit | grep -q .; then
            echo 'Release asset directory contains an unexpected subdirectory.' >&2
            exit 1
          fi

      - name: Verify approved final validation manifest
        shell: bash
        run: |
          python app/desktop/build/verify_release_validation_manifest.py \
            --manifest assets/QA/validation_campaign/release-validation/approved-release-manifest.json \
            --release-root release-assets \
            --repository-root "$GITHUB_WORKSPACE" \
            --source-commit "$SOURCE_COMMIT" \
            --version "$RELEASE_VERSION"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "XREPORT $RELEASE_TAG" \
              --generate-notes \
              --verify-tag
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "XREPORT $RELEASE_TAG" \
              --generate-notes \
              --target "$SOURCE_COMMIT"
          fi
